<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ánh Hương — Nến thơm sáp đậu nành đổ tay</title>
  <meta id="metaDesc" name="description" content="Nến thơm sáp đậu nành đổ tay từng mẻ nhỏ, ủ 14 ngày, giao toàn quốc." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" id="brandName">Ánh Hương</a>
    <nav class="nav">
      <a href="#scents" data-i18n="nav.scents"></a>
      <a href="#craft" data-i18n="nav.craft"></a>
      <a href="#care" data-i18n="nav.care"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="lang" role="group" data-i18n-aria="lang.label">
      <button type="button" data-lang="vi" aria-pressed="true">VI</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="cart-btn" id="openCart" type="button" data-i18n-aria="cart.open">
      <span data-i18n="cart.title"></span>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <main id="top">
    <!-- Đầu trang: ngọn nến được thắp lên, đổi theo mùi hương đang chọn -->
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <h1 data-i18n="hero.title"></h1>
          <p class="lead" data-i18n="hero.lead"></p>
        </div>

        <div class="hero-stage" id="heroStage">
          <div class="candle-box">
            <div class="stage-glow" aria-hidden="true"></div>
            <div id="heroCandle" aria-hidden="true"></div>
          </div>
          <div class="chips" id="heroChips" role="group" data-i18n-aria="hero.pick"></div>
        </div>

        <div class="hero-pick">
          <h2 id="heroName"></h2>
          <dl class="notes">
            <div><dt data-i18n="hero.top"></dt><dd id="heroTop"></dd></div>
            <div><dt data-i18n="hero.heart"></dt><dd id="heroHeart"></dd></div>
            <div><dt data-i18n="hero.base"></dt><dd id="heroBase"></dd></div>
          </dl>
          <p class="facts" id="heroFacts"></p>
          <div class="buy">
            <span class="price" id="heroPrice"></span>
            <button class="btn" id="heroAdd" type="button" data-add="" data-i18n="hero.add"></button>
          </div>
        </div>
      </div>
    </section>

    <section class="section section--soy" id="scents">
      <div class="wrap">
        <div class="sec-head">
          <h2 data-i18n="scents.title"></h2>
          <p class="sec-sub" data-i18n="scents.sub"></p>
        </div>
        <div class="grid" id="productGrid"></div>
      </div>
    </section>

    <section class="section section--soot" id="craft">
      <div class="wrap">
        <div class="sec-head">
          <h2 data-i18n="craft.title"></h2>
          <p class="sec-sub" data-i18n="craft.sub"></p>
        </div>
        <ol class="steps">
          <li class="step">
            <p class="step-day" data-i18n="craft.s1.day"></p>
            <h3 data-i18n="craft.s1.h"></h3>
            <p data-i18n="craft.s1.p"></p>
          </li>
          <li class="step">
            <p class="step-day" data-i18n="craft.s2.day"></p>
            <h3 data-i18n="craft.s2.h"></h3>
            <p data-i18n="craft.s2.p"></p>
          </li>
          <li class="step">
            <p class="step-day" data-i18n="craft.s3.day"></p>
            <h3 data-i18n="craft.s3.h"></h3>
            <p data-i18n="craft.s3.p"></p>
          </li>
          <li class="step">
            <p class="step-day" data-i18n="craft.s4.day"></p>
            <h3 data-i18n="craft.s4.h"></h3>
            <p data-i18n="craft.s4.p"></p>
          </li>
        </ol>
      </div>
    </section>

    <section class="section section--soy" id="care">
      <div class="wrap split">
        <h2 data-i18n="care.title"></h2>
        <ul class="tips">
          <li><h3 data-i18n="care.t1.h"></h3><p data-i18n="care.t1.p"></p></li>
          <li><h3 data-i18n="care.t2.h"></h3><p data-i18n="care.t2.p"></p></li>
          <li><h3 data-i18n="care.t3.h"></h3><p data-i18n="care.t3.p"></p></li>
          <li><h3 data-i18n="care.t4.h"></h3><p data-i18n="care.t4.p"></p></li>
        </ul>
      </div>
    </section>

    <section class="section section--soy2" id="faq">
      <div class="wrap split">
        <h2 data-i18n="faq.title"></h2>
        <div class="faq">
          <details><summary data-i18n="faq.q1"></summary><p data-i18n="faq.a1"></p></details>
          <details><summary data-i18n="faq.q2"></summary><p data-i18n="faq.a2"></p></details>
          <details><summary data-i18n="faq.q3"></summary><p data-i18n="faq.a3"></p></details>
          <details><summary data-i18n="faq.q4"></summary><p data-i18n="faq.a4"></p></details>
          <details><summary data-i18n="faq.q5"></summary><p data-i18n="faq.a5"></p></details>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap foot-grid">
      <div>
        <p class="foot-brand" id="footBrand"></p>
        <p data-i18n="footer.tagline"></p>
      </div>
      <div>
        <p><span data-i18n="footer.hotline"></span>: <span id="footPhone"></span></p>
        <p><span data-i18n="footer.email"></span>: <span id="footEmail"></span></p>
        <p><a id="footFanpage" href="#" target="_blank" rel="noopener" data-i18n="footer.fanpage"></a></p>
      </div>
      <p class="copy" data-i18n="footer.copy"></p>
    </div>
  </footer>

  <!-- Giỏ hàng -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h3 data-i18n="cart.title"></h3>
      <button class="icon-btn" id="closeCart" type="button" data-i18n-aria="cart.close">✕</button>
    </div>
    <div class="drawer-body" id="cartItems"></div>
    <div class="drawer-foot">
      <div class="row"><span data-i18n="cart.subtotal"></span><span id="cartSubtotal">0₫</span></div>
      <div class="row"><span data-i18n="cart.shipping"></span><span id="cartShip">0₫</span></div>
      <div class="row total"><span data-i18n="cart.total"></span><span id="cartTotal">0₫</span></div>
      <p class="hint" id="shipHint"></p>
      <button class="btn full" id="checkoutBtn" type="button" data-i18n="cart.checkout"></button>
    </div>
  </aside>

  <!-- Đặt hàng -->
  <dialog id="checkoutDialog">
    <div id="checkoutView">
      <div class="drawer-head">
        <h3 data-i18n="checkout.title"></h3>
        <button class="icon-btn" id="closeCheckout" type="button" data-i18n-aria="cart.close">✕</button>
      </div>
      <form class="order-form" id="orderForm" novalidate>
        <label><span data-i18n="checkout.name"></span>
          <input name="name" required autocomplete="name" />
        </label>
        <label><span data-i18n="checkout.phone"></span>
          <input name="phone" required inputmode="tel" autocomplete="tel" placeholder="09xx xxx xxx" />
        </label>
        <label><span data-i18n="checkout.address"></span>
          <textarea name="address" rows="2" required autocomplete="street-address" data-i18n-ph="checkout.addressPh"></textarea>
        </label>
        <label><span data-i18n="checkout.note"></span>
          <textarea name="note" rows="2" data-i18n-ph="checkout.notePh"></textarea>
        </label>
        <fieldset>
          <legend data-i18n="checkout.payment"></legend>
          <label class="radio"><input type="radio" name="payment" value="cod" checked /> <span data-i18n="checkout.cod"></span></label>
          <label class="radio"><input type="radio" name="payment" value="bank" /> <span data-i18n="checkout.bank"></span></label>
        </fieldset>
        <p class="form-error" id="formError" role="alert"></p>
        <div class="row total"><span data-i18n="checkout.due"></span><span id="formTotal">0₫</span></div>
        <button class="btn full" type="submit" id="submitBtn" data-i18n="checkout.submit"></button>
      </form>
    </div>

    <div id="successView" hidden>
      <div class="drawer-head">
        <h3 data-i18n="success.title"></h3>
        <button class="icon-btn" id="closeSuccess" type="button" data-i18n-aria="cart.close">✕</button>
      </div>
      <div class="success">
        <p data-i18n="success.thanks"></p>
        <p class="order-code" id="orderCode"></p>
        <p id="successMsg"></p>
        <div id="qrBox" hidden>
          <img id="qrImg" alt="VietQR" />
          <p class="hint" data-i18n="success.qr"></p>
        </div>
        <p class="demo-note" id="demoNote" hidden data-i18n="success.demo"></p>
        <button class="btn full" id="doneBtn" type="button" data-i18n="success.done"></button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
